name: AkMoney Backend CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Execute controlled Laravel migrations (php artisan migrate --force)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  id-token: write

concurrency:
  group: akmoney-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EXPECTED_AWS_ACCOUNT_ID: '415805875879'
  BACKEND_OIDC_ROLE_ARN: 'arn:aws:iam::415805875879:role/akmoney-backend-github-deploy-role'

jobs:
  validate:
    name: Validate, Lint, Test & Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan for Exposed Credentials & Secrets
        run: |
          echo "Scanning source tree for accidentally committed secrets or .env files..."
          if git ls-files --error-unmatch .env .env.production >/dev/null 2>&1; then
            echo "CRITICAL: Production environment file is tracked in Git!" >&2
            exit 1
          fi
          if grep -RInE "(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" app config database routes tests; then
            echo "CRITICAL: Potential hardcoded secret key detected in source tree!" >&2
            exit 1
          fi
          echo "Secret scan passed."

      - name: Setup PHP 8.2 Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip
          coverage: none

      - name: Validate Composer Manifest
        run: composer validate --no-check-lock --no-check-publish

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Execute PHP Syntax & Static Quality Checks
        run: |
          find app config database routes tests -name "*.php" -print0 | xargs -0 -n1 -P4 php -l

      - name: Prepare Isolated Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Execute AkMoney Financial & Security Remediation Test Suite
        run: php tests/run_tests.php --ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Validate Production Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: akmoney-backend:ci-validate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Publish to Docker Hub & Deploy to AWS EC2 via SSM
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to AWS via GitHub Actions IAM OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BACKEND_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify Target AWS Account ID (415805875879)
        run: |
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query "Account" --output text)
          echo "Authenticated to AWS Account: $ACTUAL_ACCOUNT"
          if [ "$ACTUAL_ACCOUNT" != "${{ env.EXPECTED_AWS_ACCOUNT_ID }}" ]; then
            echo "CRITICAL: AWS Account mismatch! Expected ${{ env.EXPECTED_AWS_ACCOUNT_ID }}, got $ACTUAL_ACCOUNT." >&2
            exit 1
          fi

      - name: Retrieve Backend Docker Hub Credentials from AWS SSM Parameter Store
        id: ssm-creds
        run: |
          DOCKER_USER=$(aws ssm get-parameter --name "/akmoney/ci/backend/dockerhub-username" --with-decryption --query "Parameter.Value" --output text)
          DOCKER_TOKEN=$(aws ssm get-parameter --name "/akmoney/ci/backend/dockerhub-token" --with-decryption --query "Parameter.Value" --output text)
          echo "::add-mask::${DOCKER_TOKEN}"
          echo "docker_user=${DOCKER_USER}" >> "$GITHUB_OUTPUT"
          echo "docker_token=${DOCKER_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.ssm-creds.outputs.docker_user }}
          password: ${{ steps.ssm-creds.outputs.docker_token }}

      - name: Build and Push Immutable Backend Image to Docker Hub
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ssm-creds.outputs.docker_user }}/akmoney-backend:${{ github.sha }}
            ${{ steps.ssm-creds.outputs.docker_user }}/akmoney-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record Published Image Digest
        run: |
          echo "Published Image: ${{ steps.ssm-creds.outputs.docker_user }}/akmoney-backend:${{ github.sha }}"
          echo "Image Digest: ${{ steps.build-image.outputs.digest }}"

      - name: Trigger Restricted Backend Deployment SSM Document (AkMoney-Deploy-Backend)
        id: ssm-deploy
        run: |
          IMAGE_TAG="${{ steps.ssm-creds.outputs.docker_user }}/akmoney-backend:${{ github.sha }}"
          RUN_MIGRATIONS="${{ github.event.inputs.run_migrations || 'true' }}"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=akmoney-prod-server" "Name=tag:Project,Values=AkMoney" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: No running AkMoney production EC2 instance found." >&2
            exit 1
          fi

          echo "Dispatching SSM Document AkMoney-Deploy-Backend to $INSTANCE_ID..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AkMoney-Deploy-Backend" \
            --parameters "ImageTag=[\"$IMAGE_TAG\"],RunMigrations=[\"$RUN_MIGRATIONS\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "Waiting for SSM Run Command ($COMMAND_ID) completion..."

          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; then
            echo "ERROR: Backend SSM deployment failed! Fetching command output and triggering rollback..." >&2
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "[StandardOutputContent,StandardErrorContent]" --output text || true
            exit 1
          fi

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "Deployed Backend Version: $IMAGE_TAG (${{ steps.build-image.outputs.digest }})"

      - name: Trigger Automated Rollback on Deployment Failure
        if: failure() && steps.ssm-deploy.outputs.instance_id != ''
        run: |
          echo "Initiating AkMoney-Rollback-Backend via AWS SSM..."
          ROLLBACK_CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ssm-deploy.outputs.instance_id }}" \
            --document-name "AkMoney-Rollback-Backend" \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed --command-id "$ROLLBACK_CMD_ID" --instance-id "${{ steps.ssm-deploy.outputs.instance_id }}" || true
          aws ssm get-command-invocation --command-id "$ROLLBACK_CMD_ID" --instance-id "${{ steps.ssm-deploy.outputs.instance_id }}" --query "StandardOutputContent" --output text || true
